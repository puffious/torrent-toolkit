[project]
name = "torrent-toolkit"
version = "0.1.0"
description = "Daemon in front of qBittorrent: split, organize, spoof"
requires-python = ">=3.12"
dependencies = [
    "qbittorrent-api>=2024.9",
    "guessit>=3.8",
    "httpx>=0.27",
    "apprise>=1.9",
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "pyyaml>=6.0",
]

[project.scripts]
torrent-toolkit = "torrent_toolkit.__main__:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "respx>=0.21",
    "ruff>=0.7",
]

[build-system]
requires = ["uv_build>=0.9,<0.10"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["tests/integration/qbit-config"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = ["integration: needs a running qBittorrent container"]
addopts = "-m 'not integration'"
filterwarnings = ["ignore:Using `httpx` with `starlette.testclient`"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
