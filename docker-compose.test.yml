# Throwaway qBittorrent for integration tests:
#   docker compose -f docker-compose.test.yml up -d
#   uv run pytest -m integration
services:
  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:latest
    environment:
      - PUID=1000
      - PGID=1000
      - WEBUI_PORT=8080
    volumes:
      - ./tests/integration/qbit-config:/config
    ports:
      - 18080:8080
